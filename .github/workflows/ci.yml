name: CI

on:
  # Every branch push is checked; PRs from this repo reuse those runs (same commit).
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the push changes. A branch that only touches documentation skips the slow jobs, and
  # main skips the browser and integration suites: they already passed on the PR with the
  # same code (a manual run on main runs everything).
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      full: ${{ steps.diff.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare with main
        id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "full=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            files="$(git diff --name-only HEAD^ HEAD)"
            full=false
          else
            files="$(git diff --name-only origin/main...HEAD)"
            full=true
          fi
          # Only documentation: docs/ and Markdown files anywhere.
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^docs/|\.md$'; then code=false; else code=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Changed files: $(echo "$files" | wc -l) · code: $code · full suites: $full" >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Format · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  database:
    name: Database · migrations, RLS and invariant tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Starts only Postgres; applies supabase/migrations and supabase/seed.sql.
      - name: Start database
        run: |
          set -o pipefail
          pnpm exec supabase db start 2>&1 | tee db-start.log || {
            tail -20 db-start.log | while IFS= read -r line; do echo "::error title=db start::${line//%/%25}"; done
            exit 1
          }

      # Job logs are not always reachable: on failure, the failing assertions also go to annotations.
      - name: pgTAP tests
        run: |
          set -o pipefail
          pnpm db:test 2>&1 | tee db-test.log || {
            grep -E -A6 "not ok|Failed|ERROR|psql:|Parse errors|Bad plan|Looks like" db-test.log | head -60 | while IFS= read -r line; do echo "::error title=pgTAP::${line//%/%25}"; done
            exit 1
          }

      # Job logs are not always reachable: on failure, the findings also go to annotations.
      - name: SQL lint
        run: |
          set -o pipefail
          pnpm db:lint 2>&1 | tee sql-lint.log || {
            tail -40 sql-lint.log | while IFS= read -r line; do echo "::error title=SQL lint::${line//%/%25}"; done
            exit 1
          }

  integration:
    name: Integration · real Supabase stack
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Postgres + Auth + PostgREST + Storage + API gateway + Mailpit; everything else is skipped.
      - name: Start Supabase
        run: pnpm exec supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export local credentials
        run: |
          STATUS="$(pnpm exec supabase status -o json)"
          SECRET="$(echo "$STATUS" | jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY')"
          echo "::add-mask::$SECRET"
          {
            echo "SUPABASE_URL=$(echo "$STATUS" | jq -r '.API_URL')"
            echo "SUPABASE_PUBLISHABLE_KEY=$(echo "$STATUS" | jq -r '.PUBLISHABLE_KEY // .ANON_KEY')"
            echo "SUPABASE_SECRET_KEY=$SECRET"
            echo "MAILPIT_URL=$(echo "$STATUS" | jq -r '.MAILPIT_URL // .INBUCKET_URL // "http://127.0.0.1:54324"')"
            echo "SUPABASE_DB_URL=$(echo "$STATUS" | jq -r '.DB_URL // "postgresql://postgres:postgres@127.0.0.1:54322/postgres"')"
          } >> "$GITHUB_ENV"

      - name: Sign-in, membership, branding, media, onboarding (ZC-01), access matrix (RC-15) and durable jobs (D-01) tests
        run: |
          set -o pipefail
          pnpm --filter @rikuy/db test:integration 2>&1 | tee integration.log

      # Surfaces the failure output as annotations (readable from the PR checks view).
      - name: Report integration failure
        if: failure()
        run: |
          grep -E "FAIL|Error|expected|AssertionError|×|at .*int\.test" integration.log | head -40 | while IFS= read -r line; do
            echo "::error title=integration::${line//%/%25}"
          done
          docker logs supabase_auth_rikuy 2>&1 | tail -15 | while IFS= read -r line; do
            echo "::warning title=auth log::${line//%/%25}"
          done

      # One production build serving every municipality, including the one the operator just
      # provisioned in the integration suite (ZC-01).
      - name: Two white-label portals on one build, and visitor location (RC-06)
        env:
          PLATFORM_ROOT_DOMAIN: localhost
          PLATFORM_ADMIN_HOST: app.localhost:3000
        run: |
          set -o pipefail
          export NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          pnpm --filter @rikuy/web build
          cd apps/web
          pnpm exec next start -p 3000 > ../../next.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:3000 && break; sleep 1; done
          node e2e/portals.e2e.mjs 3000 --zc01 --logo 2>&1 | tee ../../e2e.log
          # RC-06: visitor location in a real browser (the runner's Google Chrome).
          CHROME_PATH="$(command -v google-chrome)" node e2e/location.e2e.mjs 3000 2>&1 | tee -a ../../e2e.log

      - name: Report portal failure
        if: failure()
        run: |
          cat e2e.log next.log 2>/dev/null | tail -30 | while IFS= read -r line; do
            echo "::error title=portals e2e::${line//%/%25}"
          done

      # ADR-046: the same scripts as «Backup» and «Restore drill», on this stack and its test
      # data. Back up and encrypt, empty the stack (every file, then the database back to the
      # migrations), decrypt, restore and check every table, file, portal and account.
      - name: Backup and restore drill (on this stack)
        env:
          BACKUP_SOURCE: local
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq age > /dev/null
          pkill -f "next start" || true
          umask 077
          work="$RUNNER_TEMP/backup"
          mkdir -p "$work/db" "$RUNNER_TEMP/restore"
          pnpm exec supabase db dump --local --role-only -f "$work/db/roles.sql"
          pnpm exec supabase db dump --local -f "$work/db/schema.sql"
          pnpm exec supabase db dump --local --data-only --use-copy \
            -x cron.job,cron.job_run_details,net._http_response,net.http_request_queue \
            -f "$work/db/data.sql"
          node packages/db/scripts/backup.mjs download "$work"
          node packages/db/scripts/backup.mjs manifest "$work"
          age-keygen -o "$RUNNER_TEMP/key.txt" 2> /dev/null
          tar -C "$work" -czf - manifest.json db storage \
            | age -r "$(age-keygen -y "$RUNNER_TEMP/key.txt")" -o "$RUNNER_TEMP/backup.tar.gz.age"
          rm -rf "$work"

          node packages/db/scripts/empty-local-storage.mjs
          left="$(psql "$SUPABASE_DB_URL" -XAtc "select count(*) from storage.objects")"
          if [ "$left" != "0" ]; then echo "::error::Storage was not emptied ($left files left)"; exit 1; fi
          pnpm exec supabase db reset --local --no-seed
          psql "$SUPABASE_DB_URL" -Xq -c "select cron.unschedule(jobid) from cron.job" > /dev/null

          age -d -i "$RUNNER_TEMP/key.txt" "$RUNNER_TEMP/backup.tar.gz.age" | tar -xzf - -C "$RUNNER_TEMP/restore"
          bash packages/db/scripts/backup-restore-db.sh "$RUNNER_TEMP/restore" "$SUPABASE_DB_URL"
          node packages/db/scripts/backup.mjs restore-storage "$RUNNER_TEMP/restore"
          node packages/db/scripts/backup.mjs verify "$RUNNER_TEMP/restore"

  # The browser suites, in three jobs that run at the same time (each on its own stack with
  # only the seed): the regression contracts and the panel; the Lighthouse budget of the seed
  # pages and the visit counts; the reference tours with their Lighthouse budget.
  browser:
    name: Browser · ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: contracts
            name: Contracts (RC-09/10/11/12) · panel
          - suite: lighthouse
            name: Lighthouse budget · visits and statistics
          - suite: tours
            name: Tours (RC-01/07/08) · Lighthouse of the tours · evaluation
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # A clean stack with only the seed: the same data on every run, so scores compare.
      - name: Start Supabase
        run: pnpm exec supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Export local credentials
        run: |
          STATUS="$(pnpm exec supabase status -o json)"
          SECRET="$(echo "$STATUS" | jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY')"
          echo "::add-mask::$SECRET"
          {
            echo "SUPABASE_URL=$(echo "$STATUS" | jq -r '.API_URL')"
            echo "SUPABASE_PUBLISHABLE_KEY=$(echo "$STATUS" | jq -r '.PUBLISHABLE_KEY // .ANON_KEY')"
            echo "SUPABASE_SECRET_KEY=$SECRET"
            echo "MAILPIT_URL=$(echo "$STATUS" | jq -r '.MAILPIT_URL // .INBUCKET_URL // "http://127.0.0.1:54324"')"
            echo "SUPABASE_DB_URL=$(echo "$STATUS" | jq -r '.DB_URL // "postgresql://postgres:postgres@127.0.0.1:54322/postgres"')"
          } >> "$GITHUB_ENV"
      # The assistant (ADR-038) with the simulated model: its button is on every page that
      # Lighthouse and the contracts measure, as in production.
      - name: Build and start the production server
        env:
          PLATFORM_ROOT_DOMAIN: localhost
          PLATFORM_ADMIN_HOST: app.localhost:3000
          AI_PROVIDER: simulated
          AI_DATABASE_ROLE: rikuy_ai
          # The workload's connection also writes the telemetry of errors and latency (ADR-044).
          WORKER_DATABASE_ROLE: rikuy_worker
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          export AI_DATABASE_URL="$SUPABASE_DB_URL"
          export WORKER_DATABASE_URL="$SUPABASE_DB_URL"
          # Generated for this run only; nothing here calls the runner.
          JOB_RUNNER_SECRET="$(openssl rand -hex 32)"
          export JOB_RUNNER_SECRET
          pnpm --filter @rikuy/web build
          cd apps/web
          nohup pnpm exec next start -p 3000 > ../../next.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:3000 && break; sleep 1; done
      # Widths, accessibility, links and SEO of every portal page and the admin (as an owner).
      - name: Regression contracts in a real browser
        if: matrix.suite == 'contracts' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" node e2e/contracts.e2e.mjs 3000 2>&1 | tee ../../contracts.log
      # P5 · Paso 3 (ADR-038): the visitor's assistant with the simulated model and the real
      # search — loaded on demand, answers citing this municipality's pages, invented
      # citations and web addresses dropped, English, the conversation kept on the device,
      # another origin refused, a notice when the AI quota is used up, keyboard and phone.
      - name: Visitor assistant in a real browser
        if: matrix.suite == 'contracts' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-assistant 2>&1 | tee ../../assistant.log
      # P5 · Paso 7 (ADR-042): the staff's Copilot in the panel — the review by fixed rules, a
      # question answered with this municipality's pages only, a proposal accepted field by
      # field into a draft (nothing published), a stale proposal refused, and an analyst who
      # cannot ask for proposals.
      - name: Copilot in a real browser
        if: matrix.suite == 'contracts' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-copilot 2>&1 | tee ../../copilot.log
      # ADR-043: an administrator without a second factor cannot open their municipality, sets
      # up the app (real TOTP with GoTrue), the operator resets it and it is asked again.
      - name: Second factor in a real browser
        if: matrix.suite == 'contracts' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-second-factor 2>&1 | tee ../../second-factor.log
      # ADR-047: the owner changes the address of a published destination; the cached old page
      # answers 308 to the new one (also its tour and an event's calendar file), the sitemap
      # lists only the new one, and going back works.
      - name: Address change in a real browser
        if: matrix.suite == 'contracts' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-slug 2>&1 | tee ../../slug.log
      # ADR-048: where each panorama and model is used, a replacement put in a tour's draft
      # (visitors keep the old one), deleting what no tour used, and a photo as a model's image.
      - name: Replacing and deleting media in a real browser
        if: matrix.suite == 'contracts' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-media 2>&1 | tee ../../media.log
      # ADR-049: moving a published tour (its old page leads to the new one), deleting it (its
      # pages lead to their places), and an analyst without the section.
      - name: Deleting and moving a tour in a real browser
        if: matrix.suite == 'contracts' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-tour-removal 2>&1 | tee ../../tour-removal.log
      # ADR-053: a question nothing published answers is kept masked with its page; a greeting
      # and a provider failure are not; the panel groups them, an editor sees them and another
      # municipality does not.
      - name: Unanswered questions in a real browser
        if: matrix.suite == 'contracts' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-unanswered 2>&1 | tee ../../unanswered.log
      # ADR-054: recommendations rest on the platform's facts (an invented figure is dropped),
      # change nothing, a new set replaces the last, and an analyst generates them too.
      - name: Copilot recommendations in a real browser
        if: matrix.suite == 'contracts' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-recommendations 2>&1 | tee ../../recommendations.log
      # Fails the PR when a public page breaks lighthouse-budget.json (median of 3 runs).
      - name: Lighthouse budget (mobile)
        if: matrix.suite == 'lighthouse' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" node e2e/lighthouse.mjs 3000 2>&1 | tee ../../lighthouse.log
      - name: Keep the Lighthouse reports
        if: matrix.suite == 'lighthouse' && (success() || failure())
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-reports
          path: apps/web/lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 14
      # ADR-044: a real server error recorded with its request ID and reference code, a measured
      # route, and the operator's metrics pages (search by code, «Revisar ahora»).
      - name: Metrics in a real browser
        if: matrix.suite == 'lighthouse' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-metrics 2>&1 | tee ../../metrics.log
      # ADR-051: anonymous visit counts: pages, a QR scan, «Cómo llegar» and «Compartir»
      # counted on their place, no cookies, robots and other sites never counted.
      - name: Visit counts in a real browser
        if: matrix.suite == 'lighthouse' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-visits 2>&1 | tee ../../visits.log
      # ADR-052: «Estadísticas»: the period's totals as the database adds them up, compared
      # with the period before, both CSVs, an analyst, and nothing for another municipality.
      - name: Statistics in a real browser
        if: matrix.suite == 'lighthouse' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-statistics 2>&1 | tee ../../statistics.log
      # C1 · Paso 5 (ADR-055): the monthly report — the month's figures as the database counts
      # them, print styles, «Enviar este informe ahora por correo» run by the real processor
      # (recommendations resting on their facts, the email to owners and admins), nothing
      # published, an editor without the button and another municipality's report a 404.
      - name: Monthly report in a real browser
        if: matrix.suite == 'lighthouse' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-monthly-report 2>&1 | tee ../../monthly-report.log
      # C2 · Paso 1 (ADR-056): the passport's circuits — the seed's circuit in the portal of
      # Demo Norte only, the owner builds, publishes and withdraws one, an editor only drafts.
      - name: Passport circuits in a real browser
        if: matrix.suite == 'lighthouse' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-passport 2>&1 | tee ../../passport.log
      # C2 · Paso 2 (ADR-057): stamping with and without location, the signature, renewed codes.
      - name: Passport stamps in a real browser
        if: matrix.suite == 'lighthouse' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-stamps 2>&1 | tee ../../stamps.log
      # C2 · Paso 3 (ADR-058): the voucher of a complete passport, the shop's key, redeeming once.
      - name: Passport prize in a real browser
        if: matrix.suite == 'lighthouse' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-rewards 2>&1 | tee ../../rewards.log
      # C2 · Paso 4 (ADR-059): a stamp counted once per phone, place and day; the passport in
      # «Estadísticas», its CSV and the monthly report.
      - name: Passport metrics in a real browser
        if: matrix.suite == 'lighthouse' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-passport-metrics 2>&1 | tee ../../passport-metrics.log
      # RC-01/07/08 (P4): the reference tours (a museum and a four-scene carnival) walked in a
      # real browser — entry, information and gallery, every scene forward and back, arrows,
      # the 3D model loaded only on demand, another tour, out; fast taps and late answers never
      # bring an old scene back; the tour works as text without WebGL; the panel's point
      # editor keeps every relation it was not asked to change. It adds its own tours to Demo
      # Sur (the seed's Lighthouse budget runs in its own job).
      - name: Tour viewer in a real browser (RC-01/07/08)
        if: matrix.suite == 'tours' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-tour 2>&1 | tee ../../tour.log
      # The tour pages those tours left in Demo Sur (found in its sitemap), against their own
      # lines of lighthouse-budget.json.
      - name: Lighthouse budget of the tour pages (mobile)
        if: matrix.suite == 'tours' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          LIGHTHOUSE_SET=tours LIGHTHOUSE_REQUIRE_TOURS=1 CHROME_PATH="$(command -v google-chrome)" node e2e/lighthouse.mjs 3000 2>&1 | tee ../../lighthouse-tours.log
      - name: Keep the Lighthouse reports of the tour pages
        if: matrix.suite == 'tours' && (success() || failure())
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-tour-reports
          path: apps/web/lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 14
      # ADR-045: «Evaluar el asistente» and «Evaluar el Copilot» with the simulated model: a run
      # against two demos, the trap data prepared and retired, a batch of each, a rating, and
      # no proposal left behind.
      - name: Evaluation in a real browser
        if: matrix.suite == 'tours' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e-evaluation 2>&1 | tee ../../evaluation.log
      # ADR-026: the real GLB processor and optimizer, then the original and the optimized file
      # drawn by three.js (software WebGL) from the same camera must look the same (ΔE).
      - name: GLB colors in a real browser
        if: matrix.suite == 'tours' && (success() || failure())
        working-directory: apps/web
        run: |
          set -o pipefail
          CHROME_PATH="$(command -v google-chrome)" RIKUY_MODEL_E2E_OUT="$RUNNER_TEMP/model-colors.png" \
            pnpm test:e2e-models 2>&1 | grep -v -E "^(Slice|Encoding|Total slices|Mode:|basis_compressor)" | tee ../../model-colors.log
      - name: Keep the GLB color comparison
        if: matrix.suite == 'tours' && (success() || failure())
        uses: actions/upload-artifact@v5
        with:
          name: model-colors
          path: |
            ${{ runner.temp }}/model-colors.png
            ${{ runner.temp }}/model-colors.png.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Report failures
        if: failure()
        run: |
          cat contracts.log lighthouse.log tour.log lighthouse-tours.log assistant.log copilot.log second-factor.log slug.log media.log tour-removal.log unanswered.log recommendations.log metrics.log visits.log statistics.log monthly-report.log passport.log stamps.log rewards.log passport-metrics.log evaluation.log model-colors.log 2>/dev/null | grep -E "^✗|Over budget|^  [a-z-]+\.localhost|Error|FAIL|AssertionError" | head -40 | while IFS= read -r line; do
            echo "::error title=contracts or budget::${line//%/%25}"
          done
          tail -15 next.log 2>/dev/null | while IFS= read -r line; do
            echo "::warning title=next log::${line//%/%25}"
          done

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned gitleaks CLI with checksum verification. Scans the full git history on every run
      # (the repo is small), which also avoids the action's failure on a branch's first commit.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz

      - name: Scan git history
        run: ./gitleaks git . --redact --no-banner --exit-code 1
