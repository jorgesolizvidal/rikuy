name: CI

on:
  # Every branch push is checked; PRs from this repo reuse those runs (same commit).
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  database:
    name: Database · migrations, RLS and invariant tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Starts only Postgres; applies supabase/migrations and supabase/seed.sql.
      - name: Start database
        run: |
          set -o pipefail
          pnpm exec supabase db start 2>&1 | tee db-start.log || {
            tail -20 db-start.log | while IFS= read -r line; do echo "::error title=db start::${line//%/%25}"; done
            exit 1
          }

      - name: pgTAP tests
        run: pnpm db:test

      - name: SQL lint
        run: pnpm db:lint

  integration:
    name: Integration · real Supabase stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Postgres + Auth + PostgREST + API gateway + Mailpit; everything else is skipped.
      - name: Start Supabase
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export local credentials
        run: |
          STATUS="$(pnpm exec supabase status -o json)"
          SECRET="$(echo "$STATUS" | jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY')"
          echo "::add-mask::$SECRET"
          {
            echo "SUPABASE_URL=$(echo "$STATUS" | jq -r '.API_URL')"
            echo "SUPABASE_PUBLISHABLE_KEY=$(echo "$STATUS" | jq -r '.PUBLISHABLE_KEY // .ANON_KEY')"
            echo "SUPABASE_SECRET_KEY=$SECRET"
            echo "MAILPIT_URL=$(echo "$STATUS" | jq -r '.MAILPIT_URL // .INBUCKET_URL // "http://127.0.0.1:54324"')"
          } >> "$GITHUB_ENV"

      - name: Sign-in, membership, branding and onboarding (ZC-01) tests
        run: |
          set -o pipefail
          pnpm --filter @rikuy/db test:integration 2>&1 | tee integration.log

      # Surfaces the failure output as annotations (readable from the PR checks view).
      - name: Report integration failure
        if: failure()
        run: |
          grep -E "FAIL|Error|expected|AssertionError|×|at .*int\.test" integration.log | head -40 | while IFS= read -r line; do
            echo "::error title=integration::${line//%/%25}"
          done
          docker logs supabase_auth_rikuy 2>&1 | tail -15 | while IFS= read -r line; do
            echo "::warning title=auth log::${line//%/%25}"
          done

      # One production build serving every municipality, including the one the operator just
      # provisioned in the integration suite (ZC-01).
      - name: Two white-label portals on one build
        env:
          PLATFORM_ROOT_DOMAIN: localhost
          PLATFORM_ADMIN_HOST: app.localhost:3000
        run: |
          set -o pipefail
          export NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          pnpm --filter @rikuy/web build
          cd apps/web
          pnpm exec next start -p 3000 > ../../next.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:3000 && break; sleep 1; done
          node e2e/portals.e2e.mjs 3000 --zc01 2>&1 | tee ../../e2e.log

      - name: Report portal failure
        if: failure()
        run: |
          cat e2e.log next.log 2>/dev/null | tail -30 | while IFS= read -r line; do
            echo "::error title=portals e2e::${line//%/%25}"
          done

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned gitleaks CLI with checksum verification. Scans the full git history on every run
      # (the repo is small), which also avoids the action's failure on a branch's first commit.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz

      - name: Scan git history
        run: ./gitleaks git . --redact --no-banner --exit-code 1
